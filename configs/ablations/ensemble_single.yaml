# All-in ceilings and the matching key, set 2026-08-18 after review.
#
# TWO ceilings, because one was never enough. evo_config.max_api_costs meters
# only ShinkaEvolve's OWN calls (mutation, embedding, novelty, meta). The judge
# is an external client the engine never sees, at 3 calls per scored candidate,
# so a run declared at $X could spend $X of mutation plus an unbounded amount of
# judge on top. judge/client.py enforces judge_max_cost_usd against the ledger
# before each uncached call; run_evo.py refuses to start without both keys.
#
# The arithmetic that has to close, with the judge finally counted:
#   phase 1  pilot 2.00 + 2 arms x 6.50 + reserves 4.00 = $19.00  (<= $20 working)
#   phase 2  pilot 2.00 + 6 arms x 6.50 + reserves 4.00 = $45.00  (<= $50 hard)
#
# MATCHING. Dollars and generations are both the wrong key for comparing arms:
# a dollar buys a different number of scored candidates depending on which model
# UCB1 happens to favour, and a generation may produce nothing the gate accepts.
# Arms are compared on their first matched_valid_evaluations successful
# evaluations; the dollar ceilings are safety rails, not the comparison. 150 is
# RESEARCH_DESIGN section 4's own figure, and is reachable under both extremes
# ($1.80 at pure nano, $6.14 at pure gpt-4.1).
judge_max_cost_usd: 3.50
run_max_cost_usd: 6.50
matched_valid_evaluations: 150

# Ablation: ensemble_single. Matched budget to configs/main.yaml; one mechanism changed.
# Parameters from RESEARCH_DESIGN section 3, adapted to ShinkaEvolve's config
# schema. The judge is configured separately in configs/judge.yaml and is never
# a member of the mutation ensemble below.

max_evaluation_jobs: 2
max_proposal_jobs: 2
max_db_workers: 2

db_config:
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 4
  num_top_k_inspirations: 2
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: true
  enforce_island_separation: true
  parent_selection_strategy: weighted
  parent_selection_lambda: 10
  archive_selection_strategy: "crowding"
  island_selection_strategy: equal
  # ShinkaEvolve's _get_criterion_value resolves ONLY combined_score and the
  # code-analysis metrics (loc, lloc, complexity, maintainability, nesting).
  # It never reads public_metrics, and an unrecognised name silently returns
  # 0.0 with a log warning — so naming a task metric here would add a constant
  # term to the rank normalisation and quietly distort archive selection.
  # Illumination therefore happens in analysis/novelty.py, post hoc over the
  # finished archive, not in selection. See docs/ALPHAEVOLVE_COMPARISON.md.
  archive_criteria:
    combined_score: 1.0
  enable_dynamic_islands: false

evo_config:
  patch_types: [diff, full, cross]
  patch_type_probs: [0.6, 0.3, 0.1]
  num_generations: 700
  max_api_costs: 3.00                 # phase 1 of docs/BUDGET.md
  max_patch_resamples: 3
  max_patch_attempts: 1
  max_novelty_attempts: 1
  job_type: local
  language: python
  init_program_path: tasks/japan_fp/initial.py
  results_dir: runs/abl_ensemble_single

  # Mutation ensemble: 4 models, mixed tiers, temperatures [0.0, 0.5, 1.0].
  # The judge model must NOT appear here (KICKOFF hard rule 2).
  llm_models:
    - "gpt-4.1"
  llm_kwargs:
    temperatures: [0.0, 0.5, 1.0]
    max_tokens: 32768
  llm_dynamic_selection: null
  llm_dynamic_selection_kwargs:
    exploration_coef: 1.0

  meta_rec_interval: 10
  meta_max_recommendations: 5
  meta_llm_models: ["gpt-4.1-nano"]
  meta_llm_kwargs:
    temperatures: [0.0]

  embedding_model: text-embedding-3-small
  code_embed_sim_threshold: 0.95
  novelty_llm_models: ["gpt-4.1-nano"]
  novelty_llm_kwargs:
    temperatures: [0.0]

  use_text_feedback: true             # the judge's mechanism sentences steer mutation
  evolve_prompts: false
