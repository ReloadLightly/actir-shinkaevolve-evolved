# Baseline: random search. Matched budget to configs/main.yaml.
#
# RESEARCH_DESIGN section 4 calls for two baselines, "random search and hill
# climbing at matched budget". This is the first; parent_hill_climbing.yaml is
# the second. Baselines differ from ablations: an ablation removes one
# mechanism to attribute an effect, a baseline removes the evolutionary
# guidance altogether to establish what the search is being compared against.
#
# So this config deliberately changes several things at once, which is why it
# is exempt from the one-mechanism-per-ablation rule in tests/test_configs.py:
#
#   parent_selection_strategy  weighted -> random   (no fitness-guided parents)
#   num_archive_inspirations   4 -> 0               (no stepping stones shown)
#   num_top_k_inspirations     2 -> 0               (no elites shown)
#   island_elitism             true -> false        (nothing preserved)
#   novelty rejection          on -> off            (no diversity pressure)
#
# What remains is: sample a mutation from the ensemble against the seed, score
# it, keep the record. That is the null model the main run has to beat.
#
# VERIFY BEFORE RUNNING: `parent_selection_strategy: random` is the intended
# value but has not been checked against the installed ShinkaEvolve release —
# the strategies observed in the other configs are `weighted`, `best` and
# `hill_climbing`. Confirm the accepted enum before Stage D and correct this
# line if the release names it differently.

max_evaluation_jobs: 2
max_proposal_jobs: 2
max_db_workers: 2

db_config:
  num_islands: 2
  archive_size: 40
  elite_selection_ratio: 0.3
  num_archive_inspirations: 0         # baseline: no stepping stones
  num_top_k_inspirations: 0           # baseline: no elites shown
  migration_interval: 10
  migration_rate: 0.1
  island_elitism: false               # baseline: nothing preserved
  enforce_island_separation: true
  parent_selection_strategy: random   # baseline: no fitness-guided selection
  parent_selection_lambda: 10
  archive_selection_strategy: "crowding"
  island_selection_strategy: equal
  archive_criteria:
    combined_score: 1.0
  enable_dynamic_islands: false

evo_config:
  patch_types: [diff, full, cross]
  patch_type_probs: [0.6, 0.3, 0.1]
  num_generations: 30
  max_api_costs: 2.00                  # USD 15 project ceiling (docs/BUDGET.md)
  max_patch_resamples: 3
  max_patch_attempts: 1
  max_novelty_attempts: 1
  job_type: local
  language: python
  init_program_path: tasks/japan_fp/initial.py
  results_dir: runs/base_random_search

  # Mutation ensemble: 4 models, mixed tiers, temperatures [0.0, 0.5, 1.0].
  # The judge model must NOT appear here (KICKOFF hard rule 2).
  llm_models:
    - "claude-opus-5"
    - "claude-sonnet-5"
    - "gpt-5.4"
    - "gemini-3-flash-preview"
  llm_kwargs:
    temperatures: [0.0, 0.5, 1.0]
    max_tokens: 32768
  llm_dynamic_selection: null         # baseline: no bandit over the ensemble
  llm_dynamic_selection_kwargs:
    exploration_coef: 1.0

  meta_rec_interval: 10
  meta_max_recommendations: 5
  meta_llm_models: ["claude-haiku-4-5-20251001"]
  meta_llm_kwargs:
    temperatures: [0.0]

  embedding_model: text-embedding-3-small
  code_embed_sim_threshold: 1.01      # baseline: novelty rejection disabled
  novelty_llm_models: null            # baseline: no novelty judge
  novelty_llm_kwargs:
    temperatures: [0.0]

  use_text_feedback: true             # the judge's mechanism sentences steer mutation
  evolve_prompts: false
